name: research-lab-profile
on:
  pull_request:
    paths:
      - 'scripts/research_lab.js'
      - 'scripts/test_research_lab.js'
      - 'data/research-lab.json'
      - 'assets/research-*.svg'
      - '.github/workflows/research-lab.yml'
      - 'README.md'
  schedule:
    - cron: '37 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact event revision
        run: |
          git init -q src
          git -C src fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C src checkout -q --detach FETCH_HEAD
      - name: Check assets and run tests
        working-directory: src
        run: |
          node --test scripts/test_research_lab.js
          node scripts/research_lab.js --check
          python3 -c "import xml.etree.ElementTree as ET; [ET.parse(p) for p in ['assets/research-command.svg','assets/research-ecosystem.svg']]"
  refresh:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Clone public main
        run: git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" src
      - name: Refresh public source tips
        working-directory: src
        run: |
          node --test scripts/test_research_lab.js
          node scripts/research_lab.js --refresh
          node scripts/research_lab.js --check
          python3 -c "import xml.etree.ElementTree as ET; [ET.parse(p) for p in ['assets/research-command.svg','assets/research-ecosystem.svg']]"
      - name: Publish only changed telemetry
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add data/research-lab.json assets/research-command.svg assets/research-ecosystem.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public research repository telemetry"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
